<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtered Temples</title>
    <meta name="description" content="A photo album of temples around the world, filterable by age and size.">
    <link rel="stylesheet" href="filtered-temples.css">
</head>
<body>
    <header class="site-header">
        <h1 class="site-title">Temple Album</h1>
        <nav class="filters">
            <button class="filter-btn active" data-filter="home">Home</button>
            <button class="filter-btn" data-filter="old">Old</button>
            <button class="filter-btn" data-filter="new">New</button>
            <button class="filter-btn" data-filter="large">Large</button>
            <button class="filter-btn" data-filter="small">Small</button>
        </nav>
    </header>

    <main>
        <h2 class="page-heading" id="page-heading">Home</h2>
        <!-- Temple cards are generated by filtered-temples.js -->
        <section class="gallery" id="temple-cards"></section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Mathias Abbas</p>
        <p id="last-modified"></p>
    </footer>

    <script src="filtered-temples.js" defer></script>
</body>
</html>
